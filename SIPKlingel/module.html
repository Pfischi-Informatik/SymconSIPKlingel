<style>
    html, body { height: 100%; margin: 0; }
    #tile { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; text-align: center; font-family: inherit; box-sizing: border-box; padding: 8px; }
    #bell { font-size: 48px; line-height: 1; }
    #caller { font-weight: 600; }
    #hint { font-size: 12px; opacity: .7; }
    #actions { display: none; gap: clamp(16px, 10vw, 56px); margin-top: 16px; }
    #tile.ringing #actions { display: flex; }
    #tile.ringing #bell { display: none; }
    #tile.ringing #caller { font-size: 1.4em; font-weight: 400; }
    button { width: clamp(56px, 22vmin, 128px); height: clamp(56px, 22vmin, 128px); border: 0; border-radius: 50%;
             color: #fff; cursor: pointer; padding: 0; display: grid; place-items: center; }
    button:focus-visible { outline: 3px solid var(--content-color, #fff); outline-offset: 3px; }
    button svg { width: 50%; height: 50%; }
    #reject { background: #e74536; }
    #reject svg { transform: rotate(135deg); }
    #accept { background: #54a54f; }
</style>
<div id="tile" role="status" aria-live="assertive">
    <div id="bell" aria-hidden="true">&#128276;</div>
    <div id="state"></div>
    <div id="caller"></div>
    <div id="actions">
        <button id="reject" type="button" aria-label="Ablehnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.2 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
        <button id="accept" type="button" aria-label="Annehmen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.2 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
    </div>
    <div id="hint"></div>
</div>
<script>
    // Browser spielen Ton erst nach einem Klick auf die Seite ab
    let audio = null;
    let ringTimer = null;
    let last = { ringing: false, caller: '', registered: false, canAccept: false };

    function beep(start, frequency) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.25, start);
        gain.gain.setValueAtTime(0, start + 0.35);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + 0.4);
    }

    function ringOnce() {
        if (audio && audio.state === 'running') {
            const t = audio.currentTime;
            beep(t, 880);
            beep(t + 0.45, 660);
        }
    }

    function render() {
        const soundReady = audio && audio.state === 'running';
        document.getElementById('tile').classList.toggle('ringing', last.ringing);
        document.getElementById('state').textContent = last.ringing
            ? 'Eingehender Anruf'
            : (last.registered ? 'Bereit' : 'Nicht angemeldet');
        document.getElementById('caller').textContent = last.caller ? last.caller : '';
        document.getElementById('accept').style.display = last.canAccept ? '' : 'none';
        document.getElementById('hint').textContent = soundReady ? '' : 'Antippen, um den Ton zu aktivieren';

        if (last.ringing && !ringTimer) {
            ringOnce();
            ringTimer = setInterval(ringOnce, 2500);
        } else if (!last.ringing && ringTimer) {
            clearInterval(ringTimer);
            ringTimer = null;
        }
    }

    function handleMessage(data) {
        last = typeof data === 'string' ? JSON.parse(data) : data;
        render();
    }

    document.getElementById('accept').addEventListener('click', () => requestAction('Accept', true));
    document.getElementById('reject').addEventListener('click', () => requestAction('Reject', true));

    document.getElementById('tile').addEventListener('click', async () => {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        await audio.resume();
        if (last.ringing) {
            ringOnce();
        }
        render();
    });
</script>
